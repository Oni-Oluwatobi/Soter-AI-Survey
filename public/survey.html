<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Parent Voice Study — Survey | Soter AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-white">
  <header class="header" aria-label="Site header">
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="Soter AI home">
        <img src="assets/icon.png" alt="" width="34" height="34">
        <span>Soter AI</span>
      </a>
      <div class="header-right">
        <span class="header-title">Parent Voice Study</span>
        <span class="header-confidential">Confidential</span>
      </div>
    </div>
  </header>

  <a class="skip-link" href="#survey-main">Skip to survey</a>

  <main class="survey-main" id="survey-main" aria-label="Parent Voice Survey">
    <h1 class="visually-hidden">Parent Voice Study survey</h1>

    <div class="stage" id="stage">

      <div class="survey-status">
        <div class="status-row" aria-live="polite" aria-atomic="true">
          <span class="status-section" id="status-section">Welcome</span>
          <span class="status-count" id="status-count">Getting started</span>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="question-flow" id="question-flow">
        <noscript>
          <section class="flow-item section-card welcome-card is-active">
            <span class="section-accent" aria-hidden="true"></span>
            <h2 class="section-title" tabindex="-1">JavaScript required</h2>
            <p class="section-intro">This survey needs JavaScript to run. Please enable it in your browser and reload the page.</p>
          </section>
        </noscript>
      </div>

      <nav class="survey-nav" id="survey-nav" aria-label="Survey navigation">
        <p class="nav-error" id="nav-error" role="alert" hidden></p>
        <div class="nav-buttons">
          <button type="button" class="btn btn-secondary" id="btn-back" aria-label="Go back to previous question">← Back</button>
          <button type="button" class="btn btn-primary" id="btn-next" aria-label="Continue to next question">Continue →</button>
        </div>
      </nav>

    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <strong>Soter AI — Parent Voice Study</strong>
      <span>Confidential research · Your response is voluntary</span>
    </div>
  </footer>

  <script src="questions.js"></script>
  <script src="survey.js"></script>
</body>
</html>
